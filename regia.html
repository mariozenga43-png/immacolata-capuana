<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regia & Moderazione | Immacolata Capuana 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { background: #120706; color: #fff; font-family: 'Quicksand', sans-serif; }
  .font-title { font-family: 'Bebas Neue', sans-serif; }
</style>
</head>
<body class="min-h-screen pb-16">

<header class="bg-black/90 border-b-2 border-yellow-400 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
  <div>
    <h1 class="font-title text-2xl tracking-wider text-yellow-400 leading-none">REGIA LEDWALL 3x2M</h1>
    <p class="text-xs text-zinc-400">Immacolata Capuana 2026</p>
  </div>
  <span id="stato-attivo" class="text-xs font-bold uppercase px-3 py-1 rounded-full bg-yellow-400 text-black">
    Caricamento...
  </span>
</header>

<main class="max-w-xl mx-auto px-4 pt-5 space-y-6">

  <!-- SEZIONE 1: CAMBIO MODALITÀ SCHERMO -->
  <section class="bg-zinc-900/90 border border-yellow-500/40 rounded-2xl p-4">
    <h2 class="font-title text-xl tracking-wider text-yellow-400 mb-3">1. Controllo Schermo in Piazza</h2>
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="cambiaModalita('principale')" id="btn-principale" class="mode-btn py-3 px-3 rounded-xl font-bold text-sm border border-zinc-700 bg-zinc-800 hover:border-yellow-400 transition">
        🏛️ Gala Principale
      </button>
      <button onclick="cambiaModalita('live')" id="btn-live" class="mode-btn py-3 px-3 rounded-xl font-bold text-sm border border-zinc-700 bg-zinc-800 hover:border-yellow-400 transition">
        📸 Photo Live Selfie
      </button>
      <button onclick="cambiaModalita('pino')" id="btn-pino" class="mode-btn py-3 px-3 rounded-xl font-bold text-sm border border-zinc-700 bg-zinc-800 hover:border-yellow-400 transition">
        🎸 Tribute Pino Daniele
      </button>
      <button onclick="cambiaModalita('izzo')" id="btn-izzo" class="mode-btn py-3 px-3 rounded-xl font-bold text-sm border border-zinc-700 bg-zinc-800 hover:border-yellow-400 transition">
        🎭 Biagio Izzo
      </button>
      <button onclick="cambiaModalita('ddm')" id="btn-ddm" class="mode-btn col-span-2 py-3 px-3 rounded-xl font-bold text-sm border border-zinc-700 bg-zinc-800 hover:border-yellow-400 transition">
        🎧 Live Show DJ Set DDM
      </button>
    </div>
  </section>

  <!-- SEZIONE 2: MODERAZIONE FOTO IN ARRIVO -->
  <section class="bg-zinc-900/90 border border-yellow-500/40 rounded-2xl p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-title text-xl tracking-wider text-yellow-400">2. Selfie da Approvare</h2>
      <button onclick="caricaTutteLeFoto()" class="text-xs bg-zinc-800 border border-zinc-600 px-3 py-1 rounded-lg">
        Aggiorna
      </button>
    </div>

    <div id="lista-da-approvare" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <p class="text-sm text-zinc-400 col-span-2">Controllo nuovi scatti...</p>
    </div>
  </section>

  <!-- SEZIONE 3: FOTO GIÀ APPROVATE IN ONDA SUL LEDWALL -->
  <section class="bg-zinc-900/90 border border-emerald-500/40 rounded-2xl p-4">
    <h2 class="font-title text-xl tracking-wider text-emerald-400 mb-3">3. Approvate (Visibili sul Ledwall)</h2>
    <div id="lista-approvate" class="grid grid-cols-2 gap-3">
      <p class="text-sm text-zinc-400 col-span-2">Nessuna foto approvata.</p>
    </div>
  </section>

</main>

<script>
const SUPABASE_URL = 'https://crmobnweejiepmsbteme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0h_Hv7yY6XMyI6-nQusLfw_EGv4I1TO';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function leggiModalita() {
  const { data } = await _supabase.from('regia_ledwall').select('modalita').eq('id', 1).single();
  if (data && data.modalita) {
    document.getElementById('stato-attivo').textContent = 'IN ONDA: ' + data.modalita.toUpperCase();
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.remove('bg-yellow-400', 'text-black', 'border-yellow-400');
      btn.classList.add('bg-zinc-800', 'text-white');
    });
    const attivo = document.getElementById('btn-' + data.modalita);
    if (attivo) {
      attivo.classList.remove('bg-zinc-800', 'text-white');
      attivo.classList.add('bg-yellow-400', 'text-black', 'border-yellow-400');
    }
  }
}

async function cambiaModalita(nuovaMod) {
  await _supabase.from('regia_ledwall').update({ modalita: nuovaMod }).eq('id', 1);
  leggiModalita();
}

async function caricaTutteLeFoto() {
  const [storageRes, approvateRes] = await Promise.all([
    _supabase.storage.from('foto-evento').list('', { limit: 60, sortBy: { column: 'created_at', order: 'desc' } }),
    _supabase.from('foto_approvate').select('*').order('created_at', { ascending: false })
  ]);

  const files = (storageRes.data || []).filter(f => f.name && f.name !== '.emptyFolderPlaceholder');
  const approvate = approvateRes.data || [];
  const nomiApprovati = new Set(approvate.map(a => a.file_name));

  const daApprovare = files.filter(f => !nomiApprovati.has(f.name));

  // Render Da Approvare
  const boxPending = document.getElementById('lista-da-approvare');
  if (daApprovare.length === 0) {
    boxPending.innerHTML = '<p class="text-sm text-zinc-400 col-span-2">Nessuna nuova foto in attesa di moderazione.</p>';
  } else {
    boxPending.innerHTML = daApprovare.map(file => {
      const url = _supabase.storage.from('foto-evento').getPublicUrl(file.name).data.publicUrl;
      return `
        <div class="bg-black border border-zinc-700 rounded-xl overflow-hidden flex flex-col">
          <img src="${url}" class="w-full h-56 object-contain bg-zinc-950" alt="Selfie">
          <div class="p-2.5 grid grid-cols-2 gap-2">
            <button onclick="approvaFoto('${file.name}', '${url}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs uppercase">
              ✅ Approva
            </button>
            <button onclick="eliminaFoto('${file.name}')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg text-xs uppercase">
              ❌ Scarta
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Render Già Approvate
  const boxApproved = document.getElementById('lista-approvate');
  if (approvate.length === 0) {
    boxApproved.innerHTML = '<p class="text-sm text-zinc-400 col-span-2">Nessuna foto ancora approvata.</p>';
  } else {
    boxApproved.innerHTML = approvate.map(item => `
      <div class="bg-black border border-emerald-600/50 rounded-xl overflow-hidden flex flex-col">
        <img src="${item.public_url}" class="w-full h-36 object-contain bg-zinc-950" alt="Approvata">
        <button onclick="eliminaFoto('${item.file_name}')" class="bg-red-700 hover:bg-red-600 text-white font-bold py-1.5 text-xs uppercase">
          Rimuovi dal Ledwall
        </button>
      </div>
    `).join('');
  }
}

async function approvaFoto(fileName, publicUrl) {
  await _supabase.from('foto_approvate').upsert({
    file_name: fileName,
    public_url: publicUrl,
    stato: 'approvata'
  }, { onConflict: 'file_name' });
  caricaTutteLeFoto();
}

async function eliminaFoto(fileName) {
  await _supabase.from('foto_approvate').delete().eq('file_name', fileName);
  await _supabase.storage.from('foto-evento').remove([fileName]);
  caricaTutteLeFoto();
}

leggiModalita();
caricaTutteLeFoto();
setInterval(caricaTutteLeFoto, 5000);
</script>
</body>
</html>
