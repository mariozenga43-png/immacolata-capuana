<script>
const SUPABASE_URL = 'https://crmobnweejiepmsbteme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0h_Hv7yY6XMyI6-nQusLfw_EGv4I1TO';

const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NOMI_MODALITA = {
  principale: 'Gala Principale',
  live: 'Photo Live + QR Code',
  pino: 'Tribute Live • Pino Daniele',
  izzo: 'Locandina Biagio Izzo',
  ddm: 'Locandina DJ Set DDM',
  babbo_video: 'Video Villaggio Babbo Natale',
  babbo_locandina: 'Locandina Villaggio Babbo Natale',
  babbo_qr: 'QR Code Villaggio Babbo Natale',
  bcc_video_1: 'Spot Video BCC 1',
  bcc_video_2: 'Spot Video BCC 2',
  bcc_video_3: 'Spot Video BCC 3',
  bcc_video: 'Spot Video BCC 1'
};

function aggiornaStatoPulsanti(rawMod) {
  if (!rawMod) return;
  let mod = rawMod.split('|')[0];
  if (mod === 'bcc_video') mod = 'bcc_video_1';

  document.querySelectorAll('[data-mod]').forEach(btn => {
    if (btn.dataset.mod === mod) {
      btn.classList.add('regia-btn-active');
    } else {
      btn.classList.remove('regia-btn-active');
    }
  });

  const label = document.getElementById('stato-ledwall-label');
  if (label) {
    label.textContent = 'In onda: ' + (NOMI_MODALITA[mod] || mod);
  }
}

async function inviaComando(modalita) {
  aggiornaStatoPulsanti(modalita);
  const feedback = document.getElementById('feedback-comando');
  if (feedback) {
    feedback.textContent = 'Invio...';
    feedback.className = 'text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 flex-shrink-0';
  }

  const valoreComando = `${modalita}|${Date.now()}`;

  try {
    const { data, error } = await _supabase
      .from('regia_ledwall')
      .update({ modalita: valoreComando })
      .eq('id', 1)
      .select();

    if (error || !data || data.length === 0) {
      const { error: upsertError } = await _supabase
        .from('regia_ledwall')
        .upsert({ id: 1, modalita: valoreComando });
      if (upsertError) throw upsertError;
    }

    if (feedback) {
      feedback.textContent = 'Inviato';
      feedback.className = 'text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex-shrink-0';
    }
  } catch (err) {
    console.error('Errore invio comando regia:', err);
    if (feedback) {
      feedback.textContent = 'Errore rete';
      feedback.className = 'text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-red-500/20 text-red-300 border border-red-500/40 flex-shrink-0';
    }
  }
}

async function caricaModalitaAttuale() {
  try {
    const { data, error } = await _supabase
      .from('regia_ledwall')
      .select('modalita')
      .eq('id', 1)
      .single();

    if (!error && data && data.modalita) {
      aggiornaStatoPulsanti(data.modalita);
    }
  } catch (e) {
    console.error(e);
  }
}

// =========================================================================
// MODERAZIONE SELFIE LIVE (IN FONDO ALLA PAGINA)
// =========================================================================
let ultimaFirmaLista = '';

async function caricaSelfieModerazione(forzaRender = false) {
  try {
    const [resApprovate, resStorage] = await Promise.all([
      _supabase
        .from('foto_approvate')
        .select('id, public_url, stato, created_at')
        .order('created_at', { ascending: false }),
      _supabase.storage
        .from('foto-evento')
        .list('', { limit: 120, sortBy: { column: 'created_at', order: 'desc' } })
    ]);

    const approvateRows = resApprovate.data || [];
    const storageFiles = (resStorage.data || []).filter(f => f && f.name && !f.name.startsWith('.'));

    const mappaApprovate = new Map();
    approvateRows.forEach(row => {
      if (row.stato === 'approvata' && row.public_url) {
        mappaApprovate.set(row.public_url, row);
      }
    });

    const elencoFinale = [];
    const urlVisti = new Set();

    storageFiles.forEach(file => {
      const { data: { publicUrl } } = _supabase.storage
        .from('foto-evento')
        .getPublicUrl(file.name);

      urlVisti.add(publicUrl);
      elencoFinale.push({
        fileName: file.name,
        publicUrl: publicUrl,
        approvata: mappaApprovate.has(publicUrl),
        createdAt: file.created_at || ''
      });
    });

    approvateRows.forEach(row => {
      if (row.stato === 'approvata' && row.public_url && !urlVisti.has(row.public_url)) {
        const parti = row.public_url.split('/');
        const nomeRicavato = decodeURIComponent(parti[parti.length - 1] || '');
        elencoFinale.push({
          fileName: nomeRicavato,
          publicUrl: row.public_url,
          approvata: true,
          createdAt: row.created_at || ''
        });
      }
    });

    // Prima quelle in attesa di approvazione, poi quelle già approvate
    elencoFinale.sort((a, b) => {
      if (a.approvata !== b.approvata) return a.approvata ? 1 : -1;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

    const inAttesaCount = elencoFinale.filter(i => !i.approvata).length;
    const approvateCount = elencoFinale.filter(i => i.approvata).length;

    const contatore = document.getElementById('contatore-selfie');
    if (contatore) {
      contatore.textContent = `In attesa: ${inAttesaCount} • Approvate in onda: ${approvateCount}`;
    }

    const firmaCorrente = JSON.stringify(elencoFinale.map(i => `${i.fileName}:${i.approvata ? 1 : 0}`));
    if (!forzaRender && firmaCorrente === ultimaFirmaLista) return;
    ultimaFirmaLista = firmaCorrente;

    const griglia = document.getElementById('griglia-moderazione');
    if (!griglia) return;

    if (elencoFinale.length === 0) {
      griglia.innerHTML = `
        <div class="col-span-2 bg-festive-panel/70 border border-white/10 rounded-2xl p-6 text-center text-gray-300 text-sm">
          Nessun selfie ricevuto finora.
        </div>
      `;
      return;
    }

    griglia.innerHTML = elencoFinale.map(item => {
      const safeUrl = encodeURIComponent(item.publicUrl);
      const safeFile = encodeURIComponent(item.fileName || '');

      return `
        <div class="bg-festive-panel border-2 ${item.approvata ? 'border-emerald-500/60' : 'border-festive-yellow/70'} rounded-2xl overflow-hidden flex flex-col shadow-lg">
          <div class="relative aspect-square bg-black">
            <img src="${item.publicUrl}" alt="Selfie" class="w-full h-full object-cover" loading="lazy">
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-wider ${item.approvata ? 'bg-emerald-600 text-white' : 'bg-festive-yellow text-black'} shadow">
              ${item.approvata ? 'Approvata' : 'In attesa'}
            </span>
          </div>

          <div class="p-2 grid ${item.approvata ? 'grid-cols-1' : 'grid-cols-2'} gap-1.5 bg-black/40">
            ${item.approvata ? '' : `
              <button type="button" onclick="approvaSelfie('${safeUrl}', this)" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-xs py-2.5 px-2 rounded-xl flex items-center justify-center gap-1">
                <i class="fa-solid fa-check"></i> Approva
              </button>
            `}
            <button type="button" onclick="eliminaSelfie('${safeFile}', '${safeUrl}', this)" class="bg-festive-red hover:bg-red-600 active:scale-95 text-white font-bold text-xs py-2.5 px-2 rounded-xl flex items-center justify-center gap-1">
              <i class="fa-solid fa-trash"></i> ${item.approvata ? 'Rimuovi' : 'Scarta'}
            </button>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Errore caricamento selfie moderazione:', err);
  }
}

async function approvaSelfie(encodedUrl, btn) {
  const publicUrl = decodeURIComponent(encodedUrl);
  if (btn) {
    btn.disabled = true;
    btn.textContent = '...';
  }

  try {
    const { data: esistente } = await _supabase
      .from('foto_approvate')
      .select('id')
      .eq('public_url', publicUrl)
      .limit(1);

    if (esistente && esistente.length > 0) {
      await _supabase
        .from('foto_approvate')
        .update({ stato: 'approvata' })
        .eq('public_url', publicUrl);
    } else {
      await _supabase
        .from('foto_approvate')
        .insert([{ public_url: publicUrl, stato: 'approvata' }]);
    }

    await caricaSelfieModerazione(true);
  } catch (err) {
    console.error('Errore approvazione selfie:', err);
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Approva';
    }
  }
}

async function eliminaSelfie(encodedFile, encodedUrl, btn) {
  const fileName = decodeURIComponent(encodedFile);
  const publicUrl = decodeURIComponent(encodedUrl);
  if (btn) {
    btn.disabled = true;
    btn.textContent = '...';
  }

  try {
    await _supabase
      .from('foto_approvate')
      .delete()
      .eq('public_url', publicUrl);

    if (fileName) {
      await _supabase.storage
        .from('foto-evento')
        .remove([fileName]);
    }

    await caricaSelfieModerazione(true);
  } catch (err) {
    console.error('Errore eliminazione selfie:', err);
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-trash"></i> Scarta';
    }
  }
}

// Sincronizzazione Realtime per stato regia e selfie approvati
_supabase
  .channel('regia-admin-sync')
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'regia_ledwall', filter: 'id=eq.1' }, (payload) => {
    if (payload.new && payload.new.modalita) {
      aggiornaStatoPulsanti(payload.new.modalita);
    }
  })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'foto_approvate' }, () => {
    caricaSelfieModerazione(false);
  })
  .subscribe();

caricaModalitaAttuale();
caricaSelfieModerazione(true);
setInterval(() => caricaSelfieModerazione(false), 4000);
</script>
