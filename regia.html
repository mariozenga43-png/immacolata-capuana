<!DOCTYPE html>

<body class="pb-12">

          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-emerald-500/20 border border-emerald-400 flex items-center justify-center text-emerald-300 text-xl">
              <i class="fa-solid fa-play"></i>
            </div>
            <div>
              <span class="block font-bold text-base text-white">Spot Video BCC 3 (Audio)</span>
              <span class="block text-xs text-zinc-400">File: spot-bcc-3.mp4 • Sfondo adattivo</span>
            </div>
          </div>
          <span class="badge-live hidden text-xs font-bold bg-green-500 text-black px-2.5 py-1 rounded-full uppercase">In Onda</span>
        </button>

    <!-- SEZIONE 3: VILLAGGIO DI BABBO NATALE -->
    <section>
      <h2 class="font-title text-xl tracking-widest text-red-400 uppercase mb-2.5 flex items-center gap-2">
        <i class="fa-solid fa-sleigh"></i> Villaggio di Babbo Natale
      </h2>
      <div class="grid grid-cols-1 gap-3">
        <button id="btn-babbo_video" onclick="impostaModalita('babbo_video')" class="btn-regia w-full bg-zinc-900/90 hover:bg-zinc-800 rounded-2xl p-4 flex items-center justify-between text-left">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-red-500/20 border border-red-400 flex items-center justify-center text-red-300 text-xl">
              <i class="fa-solid fa-film"></i>
            </div>
            <div>
              <span class="block font-bold text-base text-white">Video Spoiler Villaggio (Audio)</span>
              <span class="block text-xs text-zinc-400">File: spoiler-babbo-natale.mp4</span>

          </div>
          <span class="badge-live hidden text-xs font-bold bg-green-500 text-black px-2.5 py-1 rounded-full uppercase">In Onda</span>
        </button>

        <button id="btn-babbo_locandina" onclick="impostaModalita('babbo_locandina')" class="btn-regia w-full bg-zinc-900/90 hover:bg-zinc-800 rounded-2xl p-4 flex items-center justify-between text-left">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-amber-500/20 border border-amber-400 flex items-center justify-center text-amber-300 text-xl">
              <i class="fa-solid fa-image"></i>
            </div>
            <div>
              <span class="block font-bold text-base text-white">Locandina Villaggio di Babbo Natale</span>
              <span class="block text-xs text-zinc-400">Grafica HD con sfondo sfocato</span>
            </div>
          </div>

        </button>

        <button id="btn-babbo_qr" onclick="impostaModalita('babbo_qr')" class="btn-regia w-full bg-zinc-900/90 hover:bg-zinc-800 rounded-2xl p-4 flex items-center justify-between text-left">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-white/15 border border-white/50 flex items-center justify-center text-white text-xl">
              <i class="fa-solid fa-qrcode"></i>
            </div>
            <div>
              <span class="block font-bold text-base text-white">QR Code Gigante 2x2m Instagram</span>
              <span class="block text-xs text-zinc-400">Pagina ufficiale Villaggio di Babbo Natale</span>
            </div>
          </div>
          <span class="badge-live hidden text-xs font-bold bg-green-500 text-black px-2.5 py-1 rounded-full uppercase">In Onda</span>

    <!-- SEZIONE 4: LOCANDINE SPETTACOLI -->
    <section>
      <h2 class="font-title text-xl tracking-widest text-yellow-400 uppercase mb-2.5 flex items-center gap-2">
        <i class="fa-solid fa-masks-theater"></i> Locandine Spettacoli
      </h2>
      <div class="grid grid-cols-1 gap-3">
        <button id="btn-izzo" onclick="impostaModalita('izzo')" class="btn-regia w-full bg-zinc-900/90 hover:bg-zinc-800 rounded-2xl p-4 flex items-center justify-between text-left">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-purple-500/20 border border-purple-400 flex items-center justify-center text-purple-300 text-xl">

            <div>

        <button id="btn-ddm" onclick="impostaModalita('ddm')" class="btn-regia w-full bg-zinc-900/90 hover:bg-zinc-800 rounded-2xl p-4 flex items-center justify-between text-left">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-pink-500/20 border border-pink-400 flex items-center justify-center text-pink-300 text-xl">
              <i class="fa-solid fa-compact-disc"></i>
            </div>
            <div>
              <span class="block font-bold text-base text-white">Locandina Live Show DJ Set DDM</span>
              <span class="block text-xs text-zinc-400">File: locandina-ddm.jpg</span>
            </div>
          </div>

    <!-- SEZIONE 5: MODERAZIONE SELFIE PHOTO LIVE -->
    <section class="pt-2 border-t border-yellow-500/30">

        <h2 class="font-title text-xl tracking-widest text-yellow-400 uppercase flex items-center gap-2">
          <i class="fa-solid fa-shield-halved"></i> Moderazione Selfie Live
        </h2>
        <button onclick="caricaFotoModerazione()" class="text-xs bg-zinc-800 border border-yellow-500/40 text-yellow-400 px-3 py-1 rounded-lg font-bold">
          <i class="fa-solid fa-rotate-right mr-1"></i> Aggiorna
        </button>
      </div>
      <div id="lista-foto-moderazione" class="grid grid-cols-2 gap-3">

      </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://crmobnweejiepmsbteme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0h_Hv7yY6XMyI6-nQusLfw_EGv4I1TO';

const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const nomiModalita = {
  'principale': 'Gala Principale',
  'live': 'Photo Live',
  'pino': 'Pino Daniele',
  'bcc_video_1': 'Spot BCC 1',
  'bcc_video_2': 'Spot BCC 2',
  'bcc_video_3': 'Spot BCC 3',
  'bcc_video': 'Spot BCC 1',
  'babbo_video': 'Video Villaggio',
  'babbo_locandina': 'Locandina Villaggio',
  'babbo_qr': 'QR Villaggio',
  'izzo': 'Biagio Izzo',
  'ddm': 'DJ Set DDM'
};

function aggiornaEvidenziazioneTasti(mod) {
  document.querySelectorAll('.btn-regia').forEach(btn => {
    btn.classList.remove('btn-attivo');
    const badge = btn.querySelector('.badge-live');
    if (badge) badge.classList.add('hidden');
  });

  const modNormalizzata = (mod === 'bcc_video') ? 'bcc_video_1' : mod;
  const attivo = document.getElementById('btn-' + modNormalizzata);
  if (attivo) {
    attivo.classList.add('btn-attivo');
    const badge = attivo.querySelector('.badge-live');
    if (badge) badge.classList.remove('hidden');
  }

  const label = document.getElementById('label-mod-attiva');
  if (label) {
    label.textContent = 'ON AIR: ' + (nomiModalita[modNormalizzata] || modNormalizzata);
  }
}

async function leggiStatoAttuale() {
  try {
    const { data, error } = await _supabase
      .from('regia_ledwall')
      .select('modalita')
      .eq('id', 1)
      .single();

    if (error) throw error;
    if (data && data.modalita) {
      aggiornaEvidenziazioneTasti(data.modalita);
    }
  } catch (err) {
    console.error('Errore lettura stato regia:', err);
  }
}

async function impostaModalita(nuovaModalita) {
  aggiornaEvidenziazioneTasti(nuovaModalita);
  try {
    const { error } = await _supabase
      .from('regia_ledwall')
      .update({ modalita: nuovaModalita })
      .eq('id', 1);

    if (error) throw error;
  } catch (err) {
    alert('Errore cambio schermata: ' + err.message);
  }
}

async function caricaFotoModerazione() {
  const container = document.getElementById('lista-foto-moderazione');
  try {
    const { data, error } = await _supabase
      .from('foto_approvate')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(30);

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = '<p class="col-span-2 text-center text-xs text-zinc-400 py-4">Nessun selfie ricevuto finora.</p>';
      return;
    }

    container.innerHTML = data.map(foto => {
      const approvata = foto.stato === 'approvata';
      return `
        <div class="bg-zinc-900 border ${approvata ? 'border-green-500/60' : 'border-yellow-500/50'} rounded-xl overflow-hidden flex flex-col">
          <div class="relative aspect-square bg-black">
            <img src="${foto.public_url}" alt="Selfie" class="w-full h-full object-cover">
            <span class="absolute top-1.5 right-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${approvata ? 'bg-green-500 text-black' : 'bg-yellow-400 text-black'}">
              ${approvata ? 'In Onda' : 'In Attesa'}
            </span>
          </div>
          <div class="p-2 flex gap-1.5">
            ${!approvata ? `
              <button onclick="approvaFoto(${foto.id})" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-1.5 rounded-lg">
                <i class="fa-solid fa-check"></i> Approva
              </button>
            ` : ''}
            <button onclick="eliminaFoto(${foto.id})" class="flex-1 bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold py-1.5 rounded-lg">
              <i class="fa-solid fa-trash"></i> Elimina
            </button>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Errore caricamento foto:', err);
  }
}

async function approvaFoto(id) {
  try {
    const { error } = await _supabase
      .from('foto_approvate')
      .update({ stato: 'approvata' })
      .eq('id', id);
    if (error) throw error;
    caricaFotoModerazione();
  } catch (err) {
    alert('Errore approvazione: ' + err.message);
  }
}

async function eliminaFoto(id) {
  try {
    const { error } = await _supabase
      .from('foto_approvate')
      .delete()
      .eq('id', id);
    if (error) throw error;
    caricaFotoModerazione();
  } catch (err) {
    alert('Errore eliminazione: ' + err.message);
  }
}

leggiStatoAttuale();
caricaFotoModerazione();
setInterval(leggiStatoAttuale, 3000);
setInterval(caricaFotoModerazione, 6000);
</script>
</body>
</html>
