<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regia Ledwall | Immacolata Capuana 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { background-color: #120706; color: #ffffff; font-family: 'Quicksand', sans-serif; }
  .font-title { font-family: 'Bebas Neue', sans-serif; }
  .btn-active { border-color: #FFD700 !important; box-shadow: 0 0 25px rgba(255, 215, 0, 0.55); transform: scale(1.01); }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-zinc-950/90 border-2 border-yellow-500/40 rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <span class="inline-block bg-red-600/30 border border-red-500 text-yellow-400 text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2">
        Regia Live • Piazza Ponte Romano
      </span>
      <h1 class="font-title text-4xl text-yellow-400 tracking-wider">CONTROLLO LEDWALL 3x2M</h1>
      <p id="status-text" class="text-xs text-zinc-400 mt-1">Connessione in corso...</p>
    </div>

    <div class="space-y-3">
      <!-- 1. SCHERMATA PRINCIPALE IMMACOLATA CAPUANA -->
      <button id="btn-principale" onclick="cambiaModalita('principale')" class="w-full p-4 rounded-2xl bg-gradient-to-r from-red-950 to-amber-950 border-2 border-zinc-700 text-left flex items-center justify-between transition-all">
        <div>
          <span class="block font-title text-2xl text-yellow-400 tracking-wide">1. Immacolata Capuana (Principale)</span>
          <span class="block text-xs text-zinc-300">Scenografia di gala con stemma e logo evento</span>
        </div>
        <i class="fa-solid fa-star text-2xl text-yellow-400"></i>
      </button>

      <!-- 2. PHOTO LIVE (QR CODE + SELFIE) -->
      <button id="btn-live" onclick="cambiaModalita('live')" class="w-full p-4 rounded-2xl bg-zinc-900 border-2 border-zinc-700 text-left flex items-center justify-between transition-all">
        <div>
          <span class="block font-title text-2xl text-white tracking-wide">2. Photo Live (QR + Selfie)</span>
          <span class="block text-xs text-zinc-400">QR Code grande e foto dei cittadini in diretta</span>
        </div>
        <i class="fa-solid fa-camera-retro text-2xl text-yellow-400"></i>
      </button>

      <!-- 3. TRIBUTO PINO DANIELE -->
      <button id="btn-pino" onclick="cambiaModalita('pino')" class="w-full p-4 rounded-2xl bg-zinc-900 border-2 border-zinc-700 text-left flex items-center justify-between transition-all">
        <div>
          <span class="block font-title text-2xl text-white tracking-wide">3. Tributo Pino Daniele</span>
          <span class="block text-xs text-zinc-400">Visual B&N con fari di scena e frasi storiche</span>
        </div>
        <i class="fa-solid fa-guitar text-2xl text-blue-400"></i>
      </button>

      <!-- 4. BIAGIO IZZO -->
      <button id="btn-izzo" onclick="cambiaModalita('izzo')" class="w-full p-4 rounded-2xl bg-zinc-900 border-2 border-zinc-700 text-left flex items-center justify-between transition-all">
        <div>
          <span class="block font-title text-2xl text-white tracking-wide">4. Spettacolo Biagio Izzo</span>
          <span class="block text-xs text-zinc-400">Locandina ufficiale a tutto schermo</span>
        </div>
        <i class="fa-solid fa-masks-theater text-2xl text-red-400"></i>
      </button>

      <!-- 5. DDM LIVE SHOW -->
      <button id="btn-ddm" onclick="cambiaModalita('ddm')" class="w-full p-4 rounded-2xl bg-zinc-900 border-2 border-zinc-700 text-left flex items-center justify-between transition-all">
        <div>
          <span class="block font-title text-2xl text-white tracking-wide">5. Live Show DJ Set DDM</span>
          <span class="block text-xs text-zinc-400">Locandina ufficiale serata DJ Set</span>
        </div>
        <i class="fa-solid fa-music text-2xl text-purple-400"></i>
      </button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://crmobnweejiepmsbteme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0h_Hv7yY6XMyI6-nQusLfw_EGv4I1TO';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const modalitaElenco = ['principale', 'live', 'pino', 'izzo', 'ddm'];

function aggiornaStilePulsanti(attiva) {
  modalitaElenco.forEach(m => {
    const btn = document.getElementById('btn-' + m);
    if (btn) {
      if (m === attiva) btn.classList.add('btn-active');
      else btn.classList.remove('btn-active');
    }
  });
}

async function leggiStato() {
  const { data, error } = await _supabase
    .from('regia_ledwall')
    .select('modalita')
    .eq('id', 1)
    .single();

  if (!error && data) {
    aggiornaStilePulsanti(data.modalita);
    document.getElementById('status-text').textContent = 'IN ONDA ORA: ' + data.modalita.toUpperCase();
  }
}

async function cambiaModalita(nuovaModalita) {
  document.getElementById('status-text').textContent = 'Cambio schermata in corso...';
  const { error } = await _supabase
    .from('regia_ledwall')
    .update({ modalita: nuovaModalita })
    .eq('id', 1);

  if (!error) {
    aggiornaStilePulsanti(nuovaModalita);
    document.getElementById('status-text').textContent = 'IN ONDA ORA: ' + nuovaModalita.toUpperCase();
  } else {
    document.getElementById('status-text').textContent = 'Errore aggiornamento regia!';
  }
}

leggiStato();
setInterval(leggiStato, 3000);
</script>
</body>
</html>
