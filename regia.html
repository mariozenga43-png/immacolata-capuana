<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Regia Ledwall | Immacolata Capuana 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    background-color: #0d0505;
    color: #ffffff;
    font-family: 'Quicksand', sans-serif;
  }
  .font-title {
    font-family: 'Bebas Neue', sans-serif;
  }
  .btn-regia {
    transition: all 0.2s ease;
  }
  .btn-regia:active {
    transform: scale(0.97);
  }
  .btn-active {
    border-color: #FFD700 !important;
    background: linear-gradient(135deg, rgba(230, 57, 70, 0.35), rgba(255, 215, 0, 0.2)) !important;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.45);
  }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

<!-- SCHERMATA BLOCCO PIN -->
<div id="pin-screen" class="w-full max-w-sm bg-zinc-900/95 border-2 border-yellow-400/60 rounded-3xl p-6 text-center shadow-2xl">
  <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-yellow-400/10 border-2 border-yellow-400 flex items-center justify-center">
    <i class="fa-solid fa-sliders text-yellow-400 text-2xl"></i>
  </div>
  <h1 class="font-title text-3xl tracking-wider text-yellow-400">REGIA LEDWALL</h1>
  <p class="text-xs text-zinc-400 font-bold uppercase tracking-wider mb-5">Immacolata Capuana • Ponte Romano</p>
  
  <input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="Inserisci PIN (2026)" 
    class="w-full text-center text-2xl tracking-[0.5em] font-bold bg-black border-2 border-zinc-700 focus:border-yellow-400 rounded-2xl py-3 text-white outline-none mb-4">
  
  <button onclick="verificaPin()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-bold uppercase tracking-wider py-3.5 rounded-2xl shadow-lg">
    Entra in Regia
  </button>
  <p id="pin-error" class="hidden text-red-400 text-xs font-bold mt-3">PIN errato. Riprova.</p>
</div>

<!-- PANNELLO CONTROLLO REGIA -->
<div id="control-panel" class="hidden w-full max-w-md space-y-4">
  
  <!-- Header -->
  <div class="bg-zinc-900/90 border border-yellow-400/40 rounded-2xl p-4 flex items-center justify-between">
    <div>
      <h2 class="font-title text-2xl tracking-wider text-yellow-400 leading-none">REGIA LEDWALL 3x2m</h2>
      <span class="text-[11px] text-zinc-400 font-bold uppercase tracking-wider">Controllo Remoto Istantaneo</span>
    </div>
    <div id="status-badge" class="flex items-center gap-1.5 bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Online
    </div>
  </div>

  <!-- Stato Attivo -->
  <div class="bg-black/80 border border-zinc-800 rounded-2xl p-3 text-center">
    <span class="text-[11px] uppercase tracking-widest text-zinc-400 block">In onda ora sul Ledwall:</span>
    <span id="current-mode-label" class="font-title text-2xl tracking-wider text-yellow-400">CARICAMENTO...</span>
  </div>

  <!-- Pulsanti Modalità -->
  <div class="space-y-3">
    
    <!-- 1. LIVE SELFIE -->
    <button id="btn-live" onclick="cambiaModalita('live')" class="btn-regia w-full text-left bg-zinc-900 border-2 border-zinc-700 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-xl bg-red-600/20 border border-red-500 flex items-center justify-center text-red-400 text-xl">
          <i class="fa-solid fa-camera-retro"></i>
        </div>
        <div>
          <span class="block font-title text-2xl tracking-wide text-white leading-none">1. SELFIE LIVE + QR CODE</span>
          <span class="block text-xs text-zinc-400 font-semibold mt-1">Benvenuto e foto in diretta dal pubblico</span>
        </div>
      </div>
      <i class="fa-solid fa-circle-check text-2xl text-zinc-700 check-icon"></i>
    </button>

    <!-- 2. PINO DANIELE -->
    <button id="btn-pino" onclick="cambiaModalita('pino')" class="btn-regia w-full text-left bg-zinc-900 border-2 border-zinc-700 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-xl bg-blue-600/20 border border-blue-500 flex items-center justify-center text-blue-400 text-xl">
          <i class="fa-solid fa-guitar"></i>
        </div>
        <div>
          <span class="block font-title text-2xl tracking-wide text-white leading-none">2. TRIBUTE BAND PINO DANIELE</span>
          <span class="block text-xs text-zinc-400 font-semibold mt-1">Slideshow foto iconiche concerto</span>
        </div>
      </div>
      <i class="fa-solid fa-circle-check text-2xl text-zinc-700 check-icon"></i>
    </button>

    <!-- 3. BIAGIO IZZO -->
    <button id="btn-izzo" onclick="cambiaModalita('izzo')" class="btn-regia w-full text-left bg-zinc-900 border-2 border-zinc-700 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-xl bg-amber-600/20 border border-amber-500 flex items-center justify-center text-amber-400 text-xl">
          <i class="fa-solid fa-masks-theater"></i>
        </div>
        <div>
          <span class="block font-title text-2xl tracking-wide text-white leading-none">3. SPETTACOLO BIAGIO IZZO</span>
          <span class="block text-xs text-zinc-400 font-semibold mt-1">Locandina ufficiale a centro schermo</span>
        </div>
      </div>
      <i class="fa-solid fa-circle-check text-2xl text-zinc-700 check-icon"></i>
    </button>

    <!-- 4. DDM -->
    <button id="btn-ddm" onclick="cambiaModalita('ddm')" class="btn-regia w-full text-left bg-zinc-900 border-2 border-zinc-700 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-xl bg-purple-600/20 border border-purple-500 flex items-center justify-center text-purple-400 text-xl">
          <i class="fa-solid fa-headphones"></i>
        </div>
        <div>
          <span class="block font-title text-2xl tracking-wide text-white leading-none">4. LIVE SHOW / DJ SET DDM</span>
          <span class="block text-xs text-zinc-400 font-semibold mt-1">Locandina evento DDM a centro schermo</span>
        </div>
      </div>
      <i class="fa-solid fa-circle-check text-2xl text-zinc-700 check-icon"></i>
    </button>

  </div>

  <p class="text-center text-[11px] text-zinc-500 pt-2">
    Gli sponsor laterali restano sempre attivi in tutte le modalità.
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://crmobnweejiepmsbteme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0h_Hv7yY6XMyI6-nQusLfw_EGv4I1TO';
const PIN_CORRETTO = '2026';

const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const etichetteModalita = {
  'live': 'SELFIE LIVE + QR CODE',
  'pino': 'TRIBUTE BAND PINO DANIELE',
  'izzo': 'SPETTACOLO BIAGIO IZZO',
  'ddm': 'LIVE SHOW / DJ SET DDM'
};

// Sblocco automatico se già autenticato nella sessione
if (sessionStorage.getItem('regia_auth') === 'ok') {
  mostraPannello();
}

document.getElementById('pin-input').addEventListener('keyup', function(e) {
  if (e.key === 'Enter') verificaPin();
});

function verificaPin() {
  const val = document.getElementById('pin-input').value.trim();
  if (val === PIN_CORRETTO) {
    sessionStorage.setItem('regia_auth', 'ok');
    mostraPannello();
  } else {
    document.getElementById('pin-error').classList.remove('hidden');
  }
}

function mostraPannello() {
  document.getElementById('pin-screen').classList.add('hidden');
  document.getElementById('control-panel').classList.remove('hidden');
  leggiStatoAttuale();
}

function aggiornaInterfacciaPulsanti(mod) {
  document.getElementById('current-mode-label').textContent = etichetteModalita[mod] || mod.toUpperCase();
  
  ['live', 'pino', 'izzo', 'ddm'].forEach(chiave => {
    const btn = document.getElementById('btn-' + chiave);
    const icon = btn.querySelector('.check-icon');
    if (chiave === mod) {
      btn.classList.add('btn-active');
      icon.classList.remove('text-zinc-700');
      icon.classList.add('text-yellow-400');
    } else {
      btn.classList.remove('btn-active');
      icon.classList.remove('text-yellow-400');
      icon.classList.add('text-zinc-700');
    }
  });
}

async function leggiStatoAttuale() {
  try {
    const { data, error } = await _supabase
      .from('regia_ledwall')
      .select('modalita')
      .eq('id', 1)
      .single();

    if (error) throw error;
    if (data && data.modalita) {
      aggiornaInterfacciaPulsanti(data.modalita);
    }
  } catch (err) {
    console.error('Errore lettura stato:', err);
    document.getElementById('current-mode-label').textContent = 'ERRORE CONNESSIONE';
  }
}

async function cambiaModalita(nuovaModalita) {
  aggiornaInterfacciaPulsanti(nuovaModalita);
  const badge = document.getElementById('status-badge');
  badge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Invio...';

  try {
    const { error } = await _supabase
      .from('regia_ledwall')
      .update({ modalita: nuovaModalita, updated_at: new Date().toISOString() })
      .eq('id', 1);

    if (error) throw error;

    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Aggiornato';
  } catch (err) {
    console.error('Errore aggiornamento regia:', err);
    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Errore';
    alert('Errore nel cambio modalità. Controlla che la tabella regia_ledwall sia stata creata su Supabase.');
  }
}
</script>
</body>
</html>
