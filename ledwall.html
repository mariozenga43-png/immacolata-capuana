<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledwall - Immacolata Capuana</title>
    <!-- Libreria Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
        }
        
        /* Immagine a tutto schermo */
        #slideshow {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 1s ease-in-out;
            opacity: 0;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Box informativo in basso a destra con QR Code per la piazza */
        .promo-overlay {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(42, 27, 24, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .promo-text h2 {
            color: #FFD700;
            margin: 0 0 5px 0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .promo-text p {
            color: #ffffff;
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }

        .qr-box {
            background: white;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-box img {
            width: 80px;
            height: 80px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Foto in primo piano -->
    <img id="slideshow" src="" alt="Ledwall">

    <!-- Overlay fisso con QR Code -->
    <div class="promo-overlay">
        <div class="promo-text">
            <h2>Inquadra e Scatta!</h2>
            <p>Carica il tuo selfie e vedilo sul Ledwall</p>
        </div>
        <div class="qr-box">
            <!-- QR code generato automaticamente che punta al sito -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://mariozenga43-png.github.io/immacolata-capuana/" alt="QR Code Sito">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://crmobnweejiepmsbteme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0h_Hv7yY6XMyI6-nQusLfw_EGv4I1TO';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let images = [];
        let currentIndex = 0;
        const imgElement = document.getElementById('slideshtml') || document.getElementById('slideshow');

        async function fetchImages() {
            const { data, error } = await _supabase.storage.from('foto-evento').list();
            if (data && data.length > 0) {
                const newImages = data
                    .filter(file => file.name.match(/\.(jpeg|jpg|gif|png)$/i))
                    .map(file => _supabase.storage.from('foto-evento').getPublicUrl(file.name).data.publicUrl);

                if (newImages.length > 0) {
                    images = newImages;
                }
            }
        }

        function showNextImage() {
            if (images.length === 0) return;
            
            imgElement.style.opacity = 0;
            
            setTimeout(() => {
                imgElement.src = images[currentIndex];
                imgElement.style.opacity = 1;
                currentIndex = (currentIndex + 1) % images.length;
            }, 1000);
        }

        async function avviaLedwall() {
            await fetchImages();
            showNextImage();
            
            // Cambia foto ogni 10 secondi
            setInterval(showNextImage, 10000);
            
            // Cerca nuove foto ogni 30 secondi
            setInterval(fetchImages, 30000);
        }

        avviaLedwall();
    </script>
</body>
</html>
